global
    maxconn 50000
    log stdout format raw local0
    stats socket ipv4@0.0.0.0:9999 level admin
    stats timeout 2m

resolvers docker_resolver
    nameserver dns 127.0.0.11:53
    accepted_payload_size 8192

defaults
    timeout connect 10s
    timeout client 30s
    timeout server 30s
    log global
    mode http
    option httplog
    option log-health-checks
    option dontlog-normal
    option forwardfor
    option http-use-htx
    maxconn 3000
    default-server init-addr none

frontend stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 10s
    stats admin if LOCALHOST

#####################
# Kong listen ports #
#####################

#
# Expose Kong ports on :443
#
frontend local-https-shared

    # 1. Master ACL: Check if the request ends in .kong.lan or .kong.com
    acl valid_domain hdr(host) -m reg -i \.kong\.(lan|com)$

    # 2. Service ACLs: Check ONLY for the subdomain prefix
    acl is_proxy   hdr(host) -m beg -i proxy.
    acl is_konnect-dp   hdr(host) -m beg -i konnect-dp.
    acl is_manager   hdr(host) -m beg -i manager.
    acl is_admin_api hdr(host) -m beg -i api.
    acl is_portal hdr(host) -m beg -i portal.
    acl is_default_portal hdr(host) -m beg -i default.portal.
    acl is_portal_api hdr(host) -m beg -i portal-api.
    acl is_smtp hdr(host) -m beg -i mail.
    acl is_graylog hdr(host) -m beg -i graylog.
    acl is_locust hdr(host) -m beg -i locust.
    acl is_kafka_ui hdr(host) -m beg -i kafka-ui.
    acl is_ha_proxy hdr(host) -m beg -i ha-proxy.
    acl is_redis_commander hdr(host) -m beg -i redis-commander.
    acl is_opa hdr(host) -m beg -i opa.
    acl is_web_server hdr(host) -m beg -i web-server.
    acl is_jaeger_server hdr(host) -m beg -i jaeger.
    acl is_splunk hdr(host) -m beg -i splunk.
    acl is_nginx hdr(host) -m beg -i nginx.
    acl is_solace hdr(host) -m beg -i solace.
    acl is_redisinsight hdr(host) -m beg -i redisinsight.

    bind *:443 ssl crt /tmp/ssl/customcerts/smallstep/combined-wild.pem alpn h2,http/1.1 tfo name kong_ssl_port
    bind *:80
    mode http
    option forwardfor
    use_backend kong_http_proxy_nodes if is_proxy
    use_backend kong_http_konnect_proxy_nodes if is_konnect-dp

    # 3. Logic: Match BOTH (Service AND Valid Domain)
    use_backend kong_http_admin_api_nodes if is_admin_api valid_domain
    use_backend kong_http_manager_nodes if is_manager valid_domain
    use_backend kong_http_dev_portal_nodes if is_portal valid_domain
    use_backend kong_http_dev_portal_nodes if is_default_portal valid_domain
    use_backend kong_http_dev_portal_api_nodes if is_portal_api valid_domain
    use_backend utility_smtp_nodes if is_smtp valid_domain
    use_backend utility_graylog_nodes if is_graylog valid_domain
    use_backend utility_locust_nodes if is_locust valid_domain
    use_backend utility_kafka_ui_nodes if is_kafka_ui valid_domain
    use_backend utility_ha_proxy_nodes if is_ha_proxy valid_domain
    use_backend utility_redis_commander_nodes if is_redis_commander valid_domain
    use_backend utility_opa_nodes if is_opa valid_domain
    use_backend utility_web_server_nodes if is_web_server valid_domain
    use_backend utility_jaeger_server_nodes if is_jaeger_server valid_domain
    use_backend utility_splunk_nodes if is_splunk valid_domain
    use_backend utility_nginx_nodes if is_nginx valid_domain
    use_backend utility_solace_nodes if is_solace valid_domain
    use_backend utility_redis_insight_nodes if is_redisinsight valid_domain
    default_backend kong_http_proxy_nodes
#
# Kong Proxy port
#
frontend local-http-proxy
    bind *:8000
    mode tcp
    default_backend kong_http_proxy_passthrough_nodes

frontend local-https-proxy
    bind *:8443
    mode tcp
    option tcplog
    default_backend kong_https_proxy_nodes

#
# Kong Proxy port with proxy_protocol
#
frontend local-http-proxy-protocol
    bind *:8800
    mode tcp
    default_backend kong_http_proxy_protocol_passthrough_nodes

frontend local-https-proxy-protocol
    bind *:8843
    mode tcp
    option tcplog
    default_backend kong_https_proxy_protocol_nodes

#
# Kong Stream port
#
frontend local-tcp-proxy
    bind *:5555
    mode tcp
    option tcplog
    default_backend kong_tcp_stream_nodes

frontend local-tcps-proxy
    bind *:5556
    mode tcp
    option tcplog
    default_backend kong_tcps_stream_nodes

#
# Kong Admin API port
#
frontend local-http-admin-api
    bind *:8001
    mode http
    default_backend kong_http_admin_api_nodes

frontend local-https-admin-api
    bind *:8444
    mode tcp
    option tcplog
    default_backend kong_https_admin_api_nodes

#
# Kong Kong Manager GUI port
#
frontend local-http-manager
    bind *:8002
    mode http
    default_backend kong_http_manager_nodes

frontend local-https-manager
    bind *:8445
    mode tcp
    option tcplog
    default_backend kong_https_manager_nodes

#
# Kong Dev Portal GUI port
#
frontend local-http-dev-portal
    bind *:8003
    mode http
    default_backend kong_http_dev_portal_nodes

frontend local-https-dev-portal
    bind *:8446
    mode tcp
    option tcplog
    default_backend kong_https_dev_portal_nodes

#
# Kong Dev Portal API port
#
frontend local-http-dev-portal-api
    bind *:8004
    mode http
    default_backend kong_http_dev_portal_api_nodes

frontend local-https-dev-portal-api
    bind *:8447
    mode tcp
    option tcplog
    default_backend kong_https_dev_portal_api_nodes
#
# Kong Status port
#
frontend local-https-status_cp
    bind *:8100
    mode tcp
    option tcplog
    default_backend kong_https_status_nodes_cp

frontend local-https-status_dp
    bind *:8101
    mode tcp
    option tcplog
    default_backend kong_https_status_nodes_dp

#
# Kong Status port
#
frontend local-https-debug_cp
    bind *:8200
    mode tcp
    option tcplog
    default_backend kong_https_debug_nodes_cp

frontend local-https-debug_dp
    bind *:8201
    mode tcp
    option tcplog
    default_backend kong_https_debug_nodes_dp

#
# Utility web server
#
frontend local-https-webserver
    bind *:8181
    mode tcp
    option tcplog
    default_backend utility_web_server_nodes


######################
# Kong cluster nodes #
######################

#
# Kong Proxy nodes
#
backend kong_http_proxy_nodes
    mode http
    balance roundrobin
    http-request set-header X-Forwarded-Host %[req.hdr(Host)]
    http-response set-header x-kong-dp-node %si
    server-template kong-proxy-http 20 kong-dp:48000 check resolvers docker_resolver init-addr none

backend kong_http_konnect_proxy_nodes
    mode http
    balance roundrobin
    http-request set-header X-Forwarded-Host %[req.hdr(Host)]
    http-response set-header x-kong-konnect-dp-node %si
    server-template kong-proxy-http 20 konnect-dp:8000 check resolvers docker_resolver init-addr none

backend kong_http_proxy_passthrough_nodes
    mode tcp
    server-template kong-proxy-http 20 kong-dp:48000 check resolvers docker_resolver init-addr none

backend kong_https_proxy_nodes
    mode tcp
    server-template kong-proxy-https 20 kong-dp:48443 check resolvers docker_resolver init-addr none

#
# proxy_protocol nodes
#
backend kong_http_proxy_protocol_passthrough_nodes
    mode tcp
    server-template kong-proxy-http 20 kong-dp:48800 check resolvers docker_resolver init-addr none

backend kong_https_proxy_protocol_nodes
    mode tcp
    server-template kong-proxy-https 20 kong-dp:48843 check resolvers docker_resolver init-addr none


#
# Kong Stream port
#
backend kong_tcp_stream_nodes
    mode tcp
    server-template kong-stream-tcp 20 kong-dp:45555 check resolvers docker_resolver init-addr none

backend kong_tcps_stream_nodes
    mode tcp
    server-template kong-stream-tcps 20 kong-dp:45556 check resolvers docker_resolver init-addr none

#
# Kong Admin API nodes
#
backend kong_http_admin_api_nodes
    mode http
    balance roundrobin
    http-response set-header x-kong-cp-node %si
    server-template kong-http-admin-api 20 kong-cp:48001 check resolvers docker_resolver init-addr none

backend kong_https_admin_api_nodes
    mode tcp
    server-template kong-https-admin-api 20 kong-cp:48444 check resolvers docker_resolver init-addr none

#
# Kong Manager nodes
