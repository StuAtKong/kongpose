# kongpose — local Kong Gateway demo stack.
# See README.md for setup; see ssl-certs/README.md for certificate handling.
#
# Default `docker compose up` starts:
#   db, kong-migrations-bootstrap, kong-cp, kong-dp, ha-proxy, deck,
#   ad-server (LDAP), httpbin, httpbin-logger, mockbin, redis, fake-smtp-server.
#
# Optional profiles — use one or more: `docker compose --profile <name> up`
#   upgrade        Run Kong DB migrations (`kong migrations up` + `finish`)
#   upstream       Extra mock backends: dadjokes, echo-server, echo-http-https, grpc-server
#   auth           keycloak + opa
#   utility        redis-commander, zipkin, vault, toxiproxy, locust, pgadmin, kibana, flask
#   tracing        jaeger
#   graylog        graylog + mongodb + elasticsearch
#   prometheus     prometheus, grafana, statsd-exporter
#   kafka          kafka, schema-registry, kafka-ui
#   knep           Konnect Native Event Proxy
#   konnect        Konnect-managed data plane
#   solace         solace pubsub broker
#   minio          MinIO S3-compatible object store
#   splunk         splunk enterprise (HEC)
#   nginx          standalone nginx (for proxy testing)
#   otel           OpenTelemetry collector
#   redis-cluster  6-node redis cluster (instead of single `redis`)
#   squid          squid forward proxy
#   tcpdump        capture traffic on kong-dp's network namespace
#   everything     everything above

secrets:
  kong_license:
    file: ../../.kong-license-data/license.json
  konnect_cluster_cert:
    file: ./ssl-certs/konnect/dp/cluster.crt
  konnect_cluster_key:
    file: ./ssl-certs/konnect/dp/cluster.key
#  pg_password:
#    environment: "SECRET_PG_PASSWORD"
#  pg_password_in_file:
#    file: ./tmp/POSTGRES_PASSWORD

# Specify which Kong image to run
x-kong-image:
  #image: ${KONG_DOCKER_IMAGE:-kong/kong-gateway:3.4.0.27}
  #image: ${KONG_DOCKER_IMAGE:-kong/kong-gateway:3.10.0.12}
  #image: ${KONG_DOCKER_IMAGE:-kong/kong-gateway:3.11.0.11}
  #image: ${KONG_DOCKER_IMAGE:-kong/kong-gateway:3.11.0.12}
  #image: ${KONG_DOCKER_IMAGE:-kong/kong-gateway:3.13.0.5}
  #image: ${KONG_DOCKER_IMAGE:-kong/kong-gateway:3.12.0.7}
