# This is your "lens" - it listens on port 80 and logs everything
  httpbin-logger:
    image: alpine/socat
    networks: *default-networks
#    ports:
#      - "80:80"
    # -v (verbose) prints raw data to stdout
    # TCP-LISTEN:80 listens on port 80
    # TCP:httpbin-real:80 forwards it to the backend
    command: -v TCP-LISTEN:80,fork,reuseaddr TCP:httpbin:80

  mockbin:
    networks: *default-networks
    image: "mashape/mockbin:latest"
  #    ports:
  #      - "80:80/tcp"

  # use ./tcpbin/Dockerfile to build a local image for the tcpbin echo repo
  # https://github.com/Kong/tcpbin
  #
  # tcpbin:
  #   networks:
  #     - kongpose-net
  #   image: "tcpbin:latest"

  keycloak:
    networks: *public-networks
    #image: jboss/keycloak:9.0.0
    #image: jboss/keycloak:15.0.2
    image: quay.io/keycloak/keycloak:15.0.2
    profiles: [ "auth", "everything" ]
    mem_limit: 1g
    volumes:
      - ./keycloak/kong-realm.json:/tmp/kong-realm.json
      - ./ssl-certs/smallstep/wild.kong.lan.key:/etc/x509/https/tls.key
      - ./ssl-certs/smallstep/wild.kong.lan.pem:/etc/x509/https/tls.crt
    environment:
      KEYCLOAK_USER: admin
      KEYCLOAK_PASSWORD: "${KEYCLOAK_PASSWORD:?set in .env}"
      KEYCLOAK_IMPORT: /tmp/kong-realm.json -Dkeycloak.profile.feature.upload_scripts=enabled
    ports:
      - "8080:8080/tcp"
      - "28443:8443/tcp"

#  redis:
