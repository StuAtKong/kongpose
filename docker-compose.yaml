  #image: ${KONG_DOCKER_IMAGE:-kong/kong-gateway:3.14.0.4}
  &kong-image
  image: ${KONG_DOCKER_IMAGE:-kong/kong-gateway:3.14.0.4}




x-kong-license:
  &kong-license
  KONG_LICENSE_DATA: ${KONG_LICENSE_DATA:?err}
  #KONG_LICENSE_PATH: /run/secrets/kong_license
  KONG_PORTAL_AND_VITALS_KEY: "${KONG_PORTAL_AND_VITALS_KEY:-}"

# Kong database config
x-kong-db-config:
  &kong-db-config
  KONG_DATABASE: postgres
  KONG_PG_HOST: db
  KONG_PG_DATABASE: kong
  KONG_PG_USER: kong
  KONG_PG_PASSWORD: "${KONG_PG_PASSWORD:?set in .env}"
#  KONG_PG_PASSWORD_FILE: "/run/secrets/pg_password_in_file"
  KONG_PASSWORD: "${KONG_ADMIN_TOKEN:?set in .env}"

# Common config values
