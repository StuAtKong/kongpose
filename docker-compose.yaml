#      - kongpose-net
#      - kongpose-net-internal
#    image: redis:latest
  #    ports:
  #      - "6379:6379/tcp"

  redis:
    image: redis/redis-stack:latest
#    profiles: [ "redis-stack", "everything" ]
    networks: *default-networks
#    ports:
#      - "6379:6379"
#      - "7001:8001"

  redis-cluster:
    networks: *default-networks
    image: redis:latest
    hostname: redis-node
    deploy:
      replicas: 6
    profiles: [ "redis-cluster", "everything" ]
    volumes:
      - ./redis-cluster/cluster-config.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf

  redis-commander:
    networks: *default-networks
    hostname: redis-commander
    image: rediscommander/redis-commander:latest
    profiles: [ "utility", "everything" ]
    environment:
      REDIS_HOSTS: redis
    ports:
      - "8081:8081"

  zipkin:
    networks: *public-networks
    image: openzipkin/zipkin
    profiles: [ "utility", "everything" ]
    ports:
      - "9411:9411/tcp"

  vault:
    networks: *public-networks
    image: vault:latest
    profiles: [ "utility", "everything" ]
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "${VAULT_DEV_ROOT_TOKEN_ID:?set in .env}"
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
  #    ports:
  #      - "8200:8200/tcp"

  toxiproxy:
    networks: *public-networks
    image: "shopify/toxiproxy"
    profiles: [ "utility", "everything" ]
    ports:
      - "8474:8474"

  # Create a toxiproxy configuration for postgres latency
  toxiproxy-config:
    networks: *public-networks
    image: "shopify/toxiproxy"
    profiles: [ "utility", "everything" ]
    entrypoint: >
      sh -c "/go/bin/toxiproxy-cli -h toxiproxy:8474 create proxy_latency --listen 0.0.0.0:8000 --upstream httpbin:80;
             /go/bin/toxiproxy-cli -h toxiproxy:8474 toxic add proxy_latency --upstream -t latency -a latency=5000 -a jitter=0;"

  ha-proxy:
    networks: *default-networks
    image: haproxy:2.3.5-alpine
    volumes:
      - ./ha-proxy:/usr/local/etc/haproxy:ro
      - ./ssl-certs:/tmp/ssl/customcerts
    depends_on:
      kong-cp:
        condition: service_healthy
      kong-dp:
        condition: service_healthy
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
      - "8000-8004:8000-8004/tcp"
      - "8443-8447:8443-8447/tcp"
      - "8100-8101:8100-8101/tcp"
      - "8181:8181/tcp"
      - "8200-8201:8200-8201/tcp"
      - "8404:8404/tcp"
      - "8800:8800/tcp"
      - "8843:8843/tcp"
      - "9999:9999/tcp"
      - "5555-5556:5555-5556/tcp"

  deck:
    networks: *public-networks
    image: kong/deck:latest
    volumes:
      - ./deck:/tmp/deck:ro
      - ./ssl-certs:/tmp/ssl-certs:ro
    environment:
      DECK_ANALYTICS: "off"
      DECK_KONG_ADDR: "http://kong-cp:48001"
      DECK_HEADERS: "kong-admin-token:${KONG_ADMIN_TOKEN:?set in .env}"
    depends_on:
      kong-cp:
        condition: service_healthy
      kong-dp:
        condition: service_healthy
    entrypoint: >
          sh -c "/usr/local/bin/deck gateway sync --silence-events --workspace default /tmp/deck/default-entities.yaml;
            /usr/local/bin/deck gateway sync --silence-events --skip-ca-certificates --workspace haproxy-hc /tmp/deck/hc-entities.yaml;
            /usr/local/bin/deck gateway sync --silence-events --skip-ca-certificates --workspace mtls /tmp/deck/mtls-entities.yaml;"

  locust:
    networks: *public-networks
#    image: locustio/locust:2.14.2
    image: locustio/locust
    profiles: [ "utility", "everything" ]
    #ports:
    # - "8089:8089"
    volumes:
      - ./locust:/mnt/locust
    command: -f /mnt/locust/locustfile.py

  fake-smtp-server:
    networks: *public-networks
    image: reachfive/fake-smtp-server
    #ports:
    #- "25:1025/tcp"
    #- "1080:1080/tcp"

  mongodb:
    networks: *public-networks
    image: mongo:4.2
    profiles: [ "graylog", "everything" ]
    healthcheck:
      test: echo 'db.runCommand({serverStatus:1}).ok' | mongo admin --quiet | grep 1
      interval: 10s
      timeout: 10s
      retries: 3

  elasticsearch:
    networks: *public-networks
    image: docker.elastic.co/elasticsearch/elasticsearch-oss:7.10.0
    profiles: [ "graylog", "everything" ]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl --silent --fail localhost:9200/_cluster/health || exit 1"
        ]
      interval: 30s
      timeout: 30s
      retries: 3
    environment:
      - http.host=0.0.0.0
      - transport.host=localhost
      - network.host=0.0.0.0
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    mem_limit: 1g

  graylog:
    networks: *public-networks
    image: graylog/graylog:4.0.7
    profiles: [ "graylog", "everything" ]
    volumes:
      #- ./graylog/server.conf:/etc/graylog/server.conf
      - ./graylog/content_packs:/usr/share/graylog/data/contentpacks
    depends_on:
      mongodb:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    environment:
      # CHANGE ME (must be at least 16 characters)!
      GRAYLOG_PASSWORD_SECRET: "${GRAYLOG_PASSWORD_SECRET:?set in .env}"
      # Password: admin
      GRAYLOG_ROOT_PASSWORD_SHA2: 8c6976e5b5410415bde908bd4dee15dfb167a9c873fc4bb8a81f6f2ab448a918
      GRAYLOG_HTTP_EXTERNAL_URI: https://graylog.kong.lan/
      GRAYLOG_HTTP_PUBLISH_URI: https://graylog.kong.lan/
      GRAYLOG_CONTENT_PACKS_LOADER_ENABLED: "true"
      GRAYLOG_CONTENT_PACKS_DIR: /usr/share/graylog/data/contentpacks
      GRAYLOG_CONTENT_PACKS_AUTO_INSTALL: kong-log-endpoints.json
    links:
      - mongodb:mongo
      - elasticsearch
    ports:
      # Graylog web interface and REST API
      - 9000:9000
      # Syslog TCP
      #- 1514:1514
      # Syslog UDP
      #- 1514:1514/udp
      # GELF TCP
      #- 12201:12201
      # GELF UDP
      #- 12201:12201/udp
      #- "5555:5555"
      #- "5555:5555/udp"

  pgadmin:
    networks: *public-networks
    image: dpage/pgadmin4
    profiles: [ "utility", "everything" ]
    volumes:
      - ./pgadmin/servers.json:/pgadmin4/servers.json
      - ./pgadmin/config_local.py:/pgadmin4/config_local.py #  - ./pgadmin_data/pgadmin:/var/lib/pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: "stu@konghq.com"
      PGADMIN_DEFAULT_PASSWORD: "${PGADMIN_DEFAULT_PASSWORD:?set in .env}"
      PGADMIN_LISTEN_PORT: 7071
    ports:
      - "7071:7071"

  kibana:
    image: docker.elastic.co/kibana/kibana:7.11.2
    profiles: [ "utility", "everything" ]
    networks: *public-networks
    #   hostname: kibana
    #   container_name: kibana
    ports:
      - 5601:5601

  # filebeat:
  #   image: docker.elastic.co/beats/filebeat:7.2.0
  #   hostname: filebeat
  #   networks:
  #     - kongpose-net
  #   container_name: filebeat
  #   user: root
  #   volumes:
  #     - ./data/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
  #     - /var/lib/docker:/var/lib/docker:ro
  #     - /var/run/docker.sock:/var/run/docker.sock

  statsd-exporter:
    image: prom/statsd-exporter:latest
    profiles: [ "prometheus", "everything" ]
    #image: kong/statsd-exporter-advanced:0.3.1
    networks: *public-networks
    user: root
    volumes:
      - ./statsd-exporter/statsd.rules.yaml:/tmp/statsd.rules.yaml
    command:
      - "--statsd.mapping-config=/tmp/statsd.rules.yaml"
      - "--statsd.listen-unixgram=''"

  prometheus:
    image: prom/prometheus:v2.35.0
    profiles: [ "prometheus", "everything" ]
    networks: *public-networks
    volumes:
      - ./prometheus/:/etc/prometheus/
    command:
      - "--config.file=/etc/prometheus/prometheus.yaml"
      - "--log.level=debug"
    ports:
      - 9090:9090

  grafana:
    image: grafana/grafana:7.5.1
    profiles: [ "prometheus", "everything" ]
    networks: *public-networks
    #   container_name: grafana
    ports:
      - 3000:3000
    environment:
      - "GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:?set in .env}"
      - GF_SERVER_DOMAIN=grafana.kong.lan

  opa:
    image: openpolicyagent/opa:latest
    profiles: [ "auth", "everything" ]
    networks: *public-networks
    #   container_name: opa
    #   ports:
    #     - "8181:8181"
    volumes:
      - ./opa/policies/:/records
    command: "run --server --addr :8181 /records"

#  statsd:
#    image: statsd/statsd
#    profiles: [ "utility" , "everything"]
#    networks:
#      - kongpose-net
#   ports:
#     - "8125:8125"

  flask:
#    image: flask-app:latest
    image: python:latest
    profiles: [ "utility", "everything"]
    networks: *public-networks
    volumes:
      - ./flask/:/flask
#    ports:
#      - "8432:80"

  squid:
    image: ubuntu/squid
    profiles: [ "squid", "everything" ]
    networks: *default-networks
    ports:
      - "3128:3128"
      - "4128:4128"
    volumes:
      - ./squid/squid.conf:/etc/squid/squid.conf
      - ./squid/passwords:/etc/squid/passwords

  tcpdump:
    image: kaazing/tcpdump
    profiles: [ "tcpdump", "everything" ]
    network_mode: service:kong-dp
    volumes:
      - ./tcpdump:/tcpdump
    command: [ "-s", "0", "-i", "any", "-w", "/tcpdump/dns.pcap", "port 53"]

  jaeger:
    networks: *default-networks
#   image: jaegertracing/all-in-one:1.50
    image: jaegertracing/all-in-one
    profiles: [ "tracing", "everything" ]
    environment:
      - COLLECTOR_ZIPKIN_HTTP_PORT=9411
      - COLLECTOR_OTLP_ENABLED=true
#    ports:
#      - 5775:5775/udp
#      - 6831:6831/udp
#      - 6832:6832/udp
#      - 5778:5778
#      - 16686:16686 # UI
#      - 14268:14268
#      - 14250:14250
#      - 9411:9411

  nginx:
    networks: *default-networks
    image: nginx
    profiles: [ "nginx", "everything" ]
    volumes:
        - ./nginx/src:/var/www
        - ./nginx/nginx-proxy.conf:/etc/nginx/conf.d/nginx-proxy.conf
    ports:
      - 8888:8888

  splunk:
    networks: *default-networks
    image: splunk/splunk:9.0.2
    profiles: [ "splunk", "everything" ]
    environment:
      SPLUNK_START_ARGS: "--accept-license"
      SPLUNK_HEC_TOKEN: "${SPLUNK_HEC_TOKEN:?set in .env}"
      SPLUNK_PASSWORD: "${SPLUNK_PASSWORD:?set in .env}"
      SPLUNK_LICENSE_URI: "Free"
#    ports:
#      - 8300:8000
#      - 8388:8088

  otel-collector:
    networks: *default-networks
    image: otel/opentelemetry-collector-contrib
    profiles: [ "otel", "everything" ]
    volumes:
      - ./otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml
    ports:
      - 1888:1888 # pprof extension
      - 8888:8888 # Prometheus metrics exposed by the Collector
      - 8889:8889 # Prometheus exporter metrics
      - 13133:13133 # health_check extension
      - 4317:4317 # OTLP gRPC receiver
      - 4318:4318 # OTLP http receiver
      - 55679:55679 # zpages extension

  konnect-dp:
    <<: [ *kong-image ]
#    image: ${KONG_DOCKER_IMAGE:-kong/kong-gateway:3.12.0.2}
    networks: *default-networks
    profiles: [ "konnect", "everything" ]
    secrets:
      - konnect_cluster_cert
      - konnect_cluster_key
    environment:
      KONG_ANONYMOUS_REPORTS: "off"
      KONG_ROLE: "data_plane"
      KONG_DATABASE: "off"
      KONG_LOG_LEVEL: "debug"
      KONG_VITALS: "off"
      KONG_CLUSTER_MTLS: "pki"
      KONG_CLUSTER_CONTROL_PLANE: "5c67fd445b.eu.cp.konghq.com:443"
      KONG_CLUSTER_SERVER_NAME: "5c67fd445b.eu.cp.konghq.com"
      KONG_CLUSTER_TELEMETRY_ENDPOINT: "5c67fd445b.eu.tp.konghq.com:443"
      KONG_CLUSTER_TELEMETRY_SERVER_NAME: "5c67fd445b.eu.tp.konghq.com"
      KONG_CLUSTER_CERT: /run/secrets/konnect_cluster_cert
      KONG_CLUSTER_CERT_KEY: /run/secrets/konnect_cluster_key
      KONG_LUA_SSL_TRUSTED_CERTIFICATE: "system"
      KONG_KONNECT_MODE: "on"
      KONG_CLUSTER_RPC: "on"
      KONG_ACTIVE_TRACING: "on"
#      KONG_HEADERS: "server_tokens, latency_tokens"
#    ports:
#     - 8000:8000
#     - 8443:8443

  knep:
    image: kong/kong-native-event-proxy:latest
    networks: *default-networks
    profiles: [ "knep", "everything" ]
    environment:
      KONNECT_API_HOSTNAME: "us.api.konghq.com"
      KONNECT_CONTROL_PLANE_ID: "36ba42a3-0351-4539-8172-b960efe71c90"
      KONNECT_API_TOKEN: "${KONNECT_API_TOKEN:?set in .env}"
      KNEP__RUNTIME__DRAIN_DURATION: 1s # makes shutdown quicker, not recommended to be set like this in production 
      KNEP__OBSERVABILITY__LOG_FLAGS: "info,knep=debug" # Uncomment for debug logging
    ports:
      - 8080:8080
      - 19092:19092
    healthcheck:
      test: curl -f http://localhost:8080/health/probes/liveness
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:3.9.0
    profiles: [ "kafka", "everything" ]
    networks: *default-networks
    container_name: kafka
    ports:
      - "9092:19092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: INTERNAL://kafka:9092,CONTROLLER://kafka:9093,EXTERNAL://0.0.0.0:19092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CLUSTER_ID: 'abcdefghijklmnopqrstuv'
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs

  schema-registry:
    image: confluentinc/cp-schema-registry:latest
    profiles: [ "kafka", "everything" ]
    networks: *default-networks
    container_name: schema-registry
    depends_on:
      - kafka
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:9092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    healthcheck:
      test: curl -f http://localhost:8081/subjects
      interval: 10s
      timeout: 5s
      retries: 5

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    profiles: [ "kafka", "everything" ]
    networks: *default-networks
    container_name: kafka-ui
    environment:
      # First cluster configuration (direct Kafka connection)
      KAFKA_CLUSTERS_0_NAME: "direct-kafka-cluster"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka:9092"
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: "http://schema-registry:8081"

      # Second cluster configuration (KNEP proxy connection)
      KAFKA_CLUSTERS_1_NAME: "knep-proxy-cluster"
      KAFKA_CLUSTERS_1_BOOTSTRAPSERVERS: "knep:9092"
      KAFKA_CLUSTERS_1_SCHEMAREGISTRY: "http://schema-registry:8081"
      
      SERVER_PORT: 8082
    ports:
      - "8082:8082"

  solace:
    image: solace/solace-pubsub-standard:10.25.13
    shm_size: '1g'
    platform: linux/amd64
    networks: *default-networks
    profiles: [ "solace", "everything" ]
    volumes:
      - ./ssl-certs/smallstep:/usr/sw/var/etc/certs
#    volumes:
#      - ./ssl-certs/smallstep/combined-wild.pem:/usr/sw/jail/certs/tls.crt
#      - ./ssl-certs/smallstep:/tmp/certs
    environment:
      username_admin_globalaccesslevel: "admin"
      username_admin_password: "${SOLACE_ADMIN_PASSWORD:?set in .env}"
    ports:
      - 8080:8080  # Use this port when configuring the message broker container with Solace PubSub+ Broker Manager.
      - 55555:55555 # Your applications can use Solace APIs to connect to the message broker on this port
      - 8008:8008 # The JavaScript sample applications below use this port to pass Web Messaging traffic through the message broker
#      - 1883:1883 # Ports for MQTT connectivity, over TCP 
#      - 8000:8000 # Ports for MQTT connectivity, over WebSockets
#      - 5672:5672 # AMQP 1.0 applications using Apache QPID APIs would connect here
      - 9000:9000 # Use REST to send messaging and event data with Solace’s RESTful API port
      - 2222:2222 # Use SSH to connect to the Solace Command Line Interface (CLI) for advanced configuration

  minio:
    image: quay.io/minio/minio
    networks: *default-networks
#    container_name: minio
    profiles: [ "minio", "everything" ]
    ports:
      - "9000:9000" # API port
      - "9001:9001" # Web Console port
    command: server /data --console-address ":9001"
    restart: unless-stopped
